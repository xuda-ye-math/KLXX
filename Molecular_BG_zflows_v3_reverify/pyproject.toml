[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zflows-md"
version = "0.1.0"
description = "Full-atom Amber force-field Boltzmann generators as zflows Potentials, in pure PyTorch (torch.compile-clean)."
readme = "README.md"
requires-python = ">=3.10"
# Essential runtime deps. `import zflows_md` pulls in forcefield.py, which imports openmm + parmed at
# module top level, so both are required (not optional); torch + numpy are used throughout.
dependencies = [
    "torch>=2.7",
    "numpy",
    "parmed",   # prmtop / rst7 parsing
    "openmm",   # Amber System build (forcefield.py, runtime) + one-shot PDB -> prmtop
]

# Optional: only the per-molecule figure scripts (conformers / dihedrals / ESS history / Ramachandran).
[project.optional-dependencies]
figures = ["matplotlib", "scipy", "ase"]

[tool.setuptools.packages.find]
include = ["zflows_md*"]

# Ship all non-.py assets too: the bundled Amber inputs (data/*.prmtop, *.rst7)
# and the per-molecule template (template/config.json).
[tool.setuptools.package-data]
"zflows_md.data" = ["*"]
"zflows_md.template" = ["*"]
